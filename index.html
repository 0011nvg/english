<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Quest with Keks</title><style>
:root{--blue:#353bfa;--pink:#ff4e9a;--yellow:#ffdc2c;--ink:#18204a;--cream:#fffaf0}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:4px solid #fd9b21;outline-offset:2px}.head{background:white;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:14px 5%;gap:15px}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo i{font-style:normal;color:var(--blue)}.mode{background:#f1efff;padding:5px;border-radius:30px;display:flex}.mode button{border:0;background:transparent;padding:10px 15px;border-radius:25px;font-weight:800;color:var(--ink)}.mode button.active{background:var(--blue);color:white}.wrap{max-width:1180px;margin:auto;padding:30px 22px 70px}.hero{background:var(--yellow);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);display:flex;align-items:center;justify-content:space-between;padding:27px 32px;overflow:hidden;min-height:195px}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1;margin:9px 0;letter-spacing:-.055em}.hero p{margin:0;font-size:17px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}.hero img{width:145px;height:150px;object-fit:cover;object-position:center 19%;border-radius:18px;border:3px solid var(--ink);transform:rotate(4deg)}.layout{display:grid;grid-template-columns:210px 1fr;gap:24px;margin-top:30px;align-items:start}.nav{position:sticky;top:16px;background:white;border:2px solid var(--ink);border-radius:18px;padding:12px}.nav button{width:100%;display:flex;text-align:left;gap:10px;align-items:center;border:0;background:transparent;padding:10px;border-radius:12px;font-weight:800;color:#4d5371}.nav button .num{display:grid;place-items:center;width:30px;height:30px;background:#f1efff;border-radius:9px;color:var(--blue);flex:none}.nav button.active{background:#eaeaff;color:var(--blue)}.nav button.active .num{background:var(--blue);color:white}.panel{min-width:0;background:white;border:2px solid var(--ink);border-radius:22px;padding:clamp(20px,3.5vw,38px);box-shadow:6px 6px 0 #d8d6ff}.chip{display:inline-block;padding:8px 13px;background:#e7e7ff;border-radius:20px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em}.panel h2{font-size:clamp(29px,4vw,43px);line-height:1.05;letter-spacing:-.04em;margin:14px 0}.intro{color:#59617f;font-size:16px;line-height:1.55;margin-bottom:23px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#f7f6ff;border:2px solid #e9e7ff;border-radius:17px;padding:19px;margin:13px 0}.grid .card{margin:0}.card.yellow{background:#fff9d9;border-color:#f9e78b}.card.pink{background:#fff0f6;border-color:#ffd4e6}.card.blue{background:#eef5ff;border-color:#c9dcff}.card h3{font-size:19px;margin:7px 0 12px}.card p{line-height:1.6}.small{color:#636d8c;font-size:14px;line-height:1.55}.prompt{font-size:18px;font-weight:800;line-height:1.4}.pill{border:2px solid #d9ddf4;background:white;border-radius:12px;padding:10px 13px;margin:4px;color:var(--ink);font-weight:700}.pill:hover,.pill.selected{border-color:var(--blue);background:#e9e9ff}.pill.correct,.pill.matched{background:#dcf7dc;border-color:#61b878}.pill.wrong{background:#ffebeb;border-color:#e77777}.feedback{min-height:20px;color:#365a49;font-weight:700;font-size:14px}.queen{width:100%;max-width:450px;display:block;border:2px solid var(--ink);border-radius:15px}.teacher{background:#e6f7ec;border:2px solid #a6dbb6;padding:18px;border-radius:16px;margin:18px 0}.teacher h4{margin:0;color:#228052;font-size:12px;letter-spacing:.1em}.teacher blockquote{margin:12px 0;background:white;border-left:4px solid #45b775;padding:13px;line-height:1.5}.teacher p{font-size:14px;line-height:1.6}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.btn{border:2px solid var(--ink);border-radius:13px;padding:12px 18px;background:var(--blue);color:white;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.btn.secondary{background:white;color:var(--ink)}.wordgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wordgrid>div{background:#f7f6ff;border-radius:14px;padding:10px}.wordgrid button{display:block;width:100%;text-align:left;margin:7px 0}.story{font-size:17px;line-height:1.75}.support{background:#fff7cc;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.6}.navtitle{font-size:10px;letter-spacing:.12em;color:#9298b2;padding:10px}.progress{height:8px;background:#efeeff;border-radius:8px;margin:14px 0}.progress span{display:block;height:100%;background:var(--pink);border-radius:8px}textarea{width:100%;border:2px solid #dddff0;border-radius:10px;padding:12px;resize:vertical}.reveal{background:#fff;border:0;color:var(--blue);font-weight:800;text-decoration:underline;padding:0}.hidden{display:none}.question{font-weight:800;line-height:1.4}.match-status{min-height:25px}.quote{font-size:14px;color:#626c8a}@media(max-width:760px){.head{padding:12px 15px}.logo{font-size:18px}.mode button{padding:8px}.wrap{padding:19px 15px 50px}.hero{min-height:150px;padding:20px}.hero img{width:85px;height:100px}.hero h1{font-size:35px}.hero p{font-size:14px}.layout{display:block}.nav{position:static;display:flex;overflow:auto;margin-bottom:18px;padding:8px;gap:4px}.navtitle{display:none}.nav button{min-width:140px}.grid{grid-template-columns:1fr}.panel{padding:20px}.wordgrid{gap:6px}.wordgrid button{font-size:13px}.queen{max-width:100%}}
</style></head><body><header class="head"><div class="logo">✦ ENGLISH <i>QUEST</i> <span style="color:var(--pink)">× KEKS</span></div><div class="mode"><button id="student" class="active" onclick="setMode(false)">Student</button><button id="teacher" onclick="setMode(true)">Teacher</button></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">Your English adventure starts here ✦</div><h1>Nice to meet you!</h1><p>Talk, play and discover your English superpowers.</p></div><img src="keks.png" alt="Keks the tabby cat reading a book"></div><div class="layout"><aside class="nav"><div class="navtitle">CHOOSE YOUR MISSION</div><div id="nav"></div></aside><section class="panel"><div id="content"></div><div class="actions"><button class="btn secondary" onclick="go(-1)">← Back</button><button class="btn" onclick="go(1)">Next mission →</button></div></section></div></main><script>
const choice=(question,options,answer,explain)=>`<div class="card"><p class="question">${question}</p><div class="quiz" data-answer="${answer}" data-explain="${explain}">${options.map(o=>`<button class="pill" data-v="${o}">${o}</button>`).join('')}<p class="feedback" aria-live="polite"></p></div></div>`;
const sections=[
{nav:'Mood check',title:'Which Queen are you today?',intro:'Choose the picture that matches your mood. Tell your teacher why.',body:`<div class="grid"><div><img class="queen" src="queen.jpeg" alt="Nine numbered pictures of Queen Elizabeth II showing different moods"></div><div><div class="card yellow"><div class="eyebrow">Pick a number</div><div id="moods">${Array.from({length:9},(_,i)=>`<button class="pill" onclick="mood(this,${i+1})">${i+1}</button>`).join('')}</div><p id="moodlabel" class="small">Choose a picture 👑</p></div><div class="support"><b>Say more 💬</b><br>Today I feel … because …<br>I chose number … because …<br>I’m a bit … but I’m also …<br><br><b>Words:</b> excited · tired · curious · relaxed · nervous · cheerful · surprised</div></div></div>`,guide:`<blockquote>“Hello! It’s lovely to meet you. Which Queen are you today? Why did you choose that picture?”</blockquote><p>Model an answer first. Ask: “What happened today?” or “What makes you feel like that?” Notice confidence and spontaneous vocabulary.</p>`},
{nav:'About you',title:'Let’s get to know you',intro:'Choose a card, answer the question and ask your teacher something too.',body:`<div class="grid">${[['👋','Meet you','What do you like to be called? What three words describe you?','I’m … / My friends say I’m … / I’m good at …'],['🎮','Free time','What do you enjoy doing after school or at weekends?','I enjoy … because … / I usually … / My favourite …'],['⭐','Your favourites','What games, books, films or places do you like? Why?','I’m really into … / My favourite … is … because …'],['🌍','Dream big','What would you like to try or learn in the future?','I’d like to … / I want to … / It sounds …']].map(([emoji,title,q,s],i)=>`<div class="card ${i%2?'pink':'blue'}"><div class="eyebrow">${emoji} CHOOSE A CARD</div><h3>${title}</h3><p class="prompt">${q}</p><button class="reveal" onclick="this.nextElementSibling.classList.toggle('hidden')">💬 Show / hide speaking help</button><p class="support">${s}<br>Can you tell me more? / What about you?</p></div>`).join('')}</div>`,guide:`<blockquote>“Pick any card. Take your time. Can you tell me more? Why do you like it? What about you?”</blockquote><p>Choose 2–3 cards and ask follow-ups. Ask the learner to ask you a question. Note fluency, vocabulary, pronunciation and question formation; encourage before correcting.</p>`},
{nav:'Your English',title:'Design your perfect lesson',intro:'Select anything you like. There are no wrong answers!',body:`<div class="card yellow"><p class="prompt">What would you like to do in English?</p>${['Speak confidently','Understand videos','Travel','Play games','Read stories','Do well at school','Other'].map(t=>`<button class="pill" onclick="this.classList.toggle('selected')">${t}</button>`).join('')}<p class="support">I want to … because … / The most important thing for me is …</p></div><div class="card pink"><p class="prompt">How do you like learning?</p>${['Games','Talking','Stories','Videos','Puzzles','Projects','Working with a teacher'].map(t=>`<button class="pill" onclick="this.classList.toggle('selected')">${t}</button>`).join('')}<p class="support">I enjoy … / I learn best when … / I don’t really like …</p></div><div class="card blue"><h3>Your English story</h3><p class="prompt">What were your previous English lessons like? What was easy or difficult?</p><p class="support">Before, I … / I liked … because … / I’d like more …</p><p class="prompt">What would you like to do in English next year?</p></div>`,guide:`<blockquote>“How do you like learning? What has helped you before? What would you like to be able to do in English?”</blockquote><p>Let the learner select several options. Explore prior experiences, preferences, goals and plans. Don’t score personal choices.</p>`},
{nav:'Word games',title:'Vocabulary power-up',intro:'Choose the translation, then match the pairs. Explain your choices in English when you can.',body:`<div class="eyebrow">⚡ GAME 1 · CHOOSE THE MEANING</div>${choice('1. What does “achievement” mean?',['достижение','приключение','расписание'],'достижение','An achievement is something you have done successfully.')}${choice('2. What does “curious” mean?',['осторожный','любознательный','усталый'],'любознательный','A curious person wants to learn more.')}${choice('3. Choose the English word for «возможность».',['opportunity','competition','journey'],'opportunity','An opportunity is a chance to do something.')}${choice('4. “I get on well with my classmates.” What does it mean?',['Я хорошо лажу с одноклассниками','Я опаздываю к одноклассникам','Я учу одноклассников'],'Я хорошо лажу с одноклассниками','Get on well means have a good relationship.')}
<div class="card yellow"><div class="eyebrow">🧩 GAME 2 · MATCH THE PAIRS</div><p class="small">Tap an English word, then tap its Russian meaning.</p><div class="wordgrid"><div>${[['challenge','challenge'],['improve','improve'],['explore','explore'],['confident','confident']].map(([t,id])=>`<button class="pill match" data-side="en" data-id="${id}">${t}</button>`).join('')}</div><div>${[['исследовать','explore'],['уверенный','confident'],['улучшать','improve'],['сложная задача','challenge']].map(([t,id])=>`<button class="pill match" data-side="ru" data-id="${id}">${t}</button>`).join('')}</div></div><p id="matchStatus" class="feedback match-status" aria-live="polite">0 / 4 pairs</p><button class="reveal" onclick="resetMatch()">Play again ↻</button></div><div class="support"><b>Speaking bonus:</b> What would you like to improve? Tell me about a challenge you enjoyed.<br>I’d like to improve … / One challenge was … / I felt …</div>`,guide:`<blockquote>“Choose the best meaning. Can you use that word in a sentence? Now match the words and meanings.”</blockquote><p><b>Keys:</b> achievement — достижение; curious — любознательный; opportunity — возможность; get on well — хорошо ладить. Matching: challenge — сложная задача; improve — улучшать; explore — исследовать; confident — уверенный. Note recognition separately from active use.</p>`},
{nav:'Grammar lab',title:'Grammar detective',intro:'Choose the best answer, then make a sentence about yourself.',body:`${choice('1. I usually ___ to school by bus.',['go','am going','went'],'go','A routine: Present Simple.')}${choice('2. Look! Keks ___ a book.',['reads','is reading','read'],'is reading','Happening now: Present Continuous.')}${choice('3. Last weekend, I ___ my friend.',['visit','visited','am visiting'],'visited','A completed past action: Past Simple.')}${choice('4. At 7 p.m. yesterday, I ___ a game.',['play','was playing','will play'],'was playing','An action in progress at a past time: Past Continuous.')}${choice('5. I think I ___ something interesting tomorrow.',['will learn','learned','am learning yesterday'],'will learn','A future prediction: Future Simple.')}<div class="card pink"><h3>Make it yours 🎤</h3><p>What do you usually do at weekends? What are you doing now? What did you do yesterday?</p><p class="support">I usually … / Right now I’m … / Yesterday I … / At 7 p.m. I was … / Tomorrow I think I’ll …</p></div>`,guide:`<blockquote>“Choose the best answer. What helped you decide? Now tell me something true about yourself.”</blockquote><p><b>Keys:</b> go; is reading; visited; was playing; will learn. Ask follow-up questions to compare recognition with speaking. Keep feedback light and supportive.</p>`},
{nav:'Reading quest',title:'The mystery of Room 12',intro:'Read the story, solve the mini-mystery and share your ideas.',body:`<div class="card yellow"><div class="eyebrow">📖 A SHORT STORY · PART 1</div><div class="story"><p>On Monday morning, Leo arrived at his new school. He liked meeting new people, but today he felt a little nervous. At the door, a girl named Maya smiled and showed him a map of the building.</p><p>“There’s a mystery club after school,” she said. “We solve puzzles, make videos and explore interesting places. Would you like to come?”</p><p>After lessons, Leo followed Maya to Room 12. While they were walking along the corridor, they noticed a small envelope on the floor. Inside was a note: <b>“Find the place where stories sleep.”</b></p><p>Leo looked at the school map. “Maybe it’s the library!” he said. They hurried there and found a box behind a row of books. In the box was a camera and a second note: <b>“Your first mission: tell the story of your new school.”</b></p><p>Leo laughed. He enjoyed making videos, and now he had a team to work with. “This is going to be fun,” he said.</p></div><p class="small"><b>Word help:</b> corridor — коридор · envelope — конверт · row — ряд · mission — задание</p></div><div class="eyebrow">🔎 CHECK YOUR DETECTIVE SKILLS</div>${choice('1. How did Leo feel at the start?',['A little nervous','Angry','Bored'],'A little nervous','The first paragraph tells us how he felt.')}${choice('2. What did they find in the envelope?',['A note','A camera','A school map'],'A note','It said: “Find the place where stories sleep.”')}${choice('3. Where was the box?',['In the library','In Room 12','Outside the school'],'In the library','It was behind a row of books.')}${choice('4. What was their first mission?',['Make a story about the new school','Find an old castle','Write a test'],'Make a story about the new school','The note asks them to tell the story of the school.')}<div class="card blue"><h3>Talk about it 💬</h3><p class="prompt">Would you join the mystery club? Why or why not? What would your first video be about?</p><p class="support">I would / wouldn’t join because …<br>My video would be about …<br>I think Leo feels … at the end because …</p></div><div class="card pink"><h3>Extra challenge ✨</h3><p>Put the events in order: <b>find the box · see a note · arrive at school · go to the library</b>. Then retell the story in your own words.</p></div>`,guide:`<blockquote>“First, read the story. What is the mystery? Now find the evidence for each answer. Would you join the club?”</blockquote><p><b>Keys:</b> 1 a little nervous; 2 a note; 3 in the library; 4 tell the story of the school. Sequence: arrive at school → see a note → go to the library → find the box. Accept plausible interpretations supported by the text. Listen to a short extract read aloud for pronunciation.</p>`},
{nav:'Next adventure',title:'Your next chapter',intro:'Think about today and choose what you would like to explore next.',body:`<div class="grid"><div class="card yellow"><h3>⭐ My favourite part</h3><p class="prompt">What did you enjoy most today?</p><p class="support">I enjoyed … because …</p></div><div class="card pink"><h3>🎯 My goal</h3><p class="prompt">What would you like to improve?</p><p class="support">I’d like to get better at …</p></div><div class="card blue"><h3>🚀 Next time</h3><p class="prompt">What topics, games or stories would you like next time?</p><p class="support">Next time, I’d like to …</p></div><div class="card"><h3>❓ Your turn</h3><p class="prompt">What would you like to ask your teacher?</p><p class="support">What is your favourite …? / Do you like …?</p></div></div><div class="card yellow"><h3>High five! ✋</h3><p>You shared your ideas, played with words and solved a mystery. Great work!</p></div>`,guide:`<blockquote>“What did you enjoy most? What would you like us to practise next time? Do you have a question for me?”</blockquote><p>Give one specific strength and agree on one achievable next step. Record speaking, listening, reading, vocabulary, grammar and learner preferences. This is an initial snapshot, not a formal CEFR assessment.</p><textarea rows="4" id="notes" placeholder="Teacher notes on this device…" aria-label="Teacher notes"></textarea><p class="small">Notes stay in this browser on this device.</p>`}
];let current=0,teacher=false,matchPick=null,matched=0;function setMode(value){teacher=value;document.querySelector('#student').classList.toggle('active',!value);document.querySelector('#teacher').classList.toggle('active',value);render()}function go(n){current=Math.max(0,Math.min(sections.length-1,current+n));render();window.scrollTo({top:0,behavior:'smooth'})}function render(){matchPick=null;matched=0;let s=sections[current];document.querySelector('#nav').innerHTML=sections.map((x,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()"><span class="num">${i+1}</span>${x.nav}</button>`).join('');document.querySelector('#content').innerHTML=`<span class="chip">MISSION ${current+1} / ${sections.length}</span><div class="progress"><span style="width:${(current+1)/sections.length*100}%"></span></div><h2>${s.title}</h2><p class="intro">${s.intro}</p>${teacher?`<div class="teacher"><h4>✦ TEACHER'S GUIDE</h4>${s.guide}</div>`:''}${s.body}`;document.querySelectorAll('.quiz').forEach(q=>q.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let correct=b.dataset.v===q.dataset.answer;q.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(correct?'correct':'wrong');q.querySelector('.feedback').textContent=correct?'✓ Correct! '+q.dataset.explain:'Try again — you can do it!'}));document.querySelectorAll('.match').forEach(b=>b.addEventListener('click',()=>match(b)));let notes=document.getElementById('notes');if(notes){notes.value=localStorage.getItem('keks-lesson-notes')||'';notes.oninput=()=>localStorage.setItem('keks-lesson-notes',notes.value)}}function mood(b,n){document.querySelectorAll('#moods button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#moodlabel').textContent=`Number ${n}! How do you feel? Why?`}function match(b){if(b.classList.contains('matched'))return;if(!matchPick){matchPick=b;b.classList.add('selected');return}if(matchPick===b){b.classList.remove('selected');matchPick=null;return}if(matchPick.dataset.side===b.dataset.side){matchPick.classList.remove('selected');matchPick=b;b.classList.add('selected');return}if(matchPick.dataset.id===b.dataset.id){matchPick.classList.remove('selected');matchPick.classList.add('matched');b.classList.add('matched');matched++;document.querySelector('#matchStatus').textContent=matched===4?'4 / 4 pairs — amazing! ✨':`${matched} / 4 pairs — great match!`}else{matchPick.classList.remove('selected');document.querySelector('#matchStatus').textContent=`${matched} / 4 pairs — try another pair!`}matchPick=null}function resetMatch(){matched=0;matchPick=null;document.querySelectorAll('.match').forEach(b=>b.classList.remove('matched','selected'));document.querySelector('#matchStatus').textContent='0 / 4 pairs'}render();
</script></body></html>
