<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English</title><link rel="stylesheet" href="fonts.css"><style>
:root{--blue:#3D3BFF;--pink:#FF4FA3;--yellow:#FFD400;--ink:#16161D;--cream:#F7F4ED}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:4px solid #fd9b21;outline-offset:2px}.head{background:white;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:14px 5%;gap:15px}.logo{font-size:22px;font-weight:900;letter-spacing:-1px}.logo i{font-style:normal;color:var(--blue)}.mode{background:#f1efff;padding:5px;border-radius:30px;display:flex}.mode button{border:0;background:transparent;padding:10px 15px;border-radius:25px;font-weight:800;color:var(--ink)}.mode button.active{background:var(--blue);color:white}.wrap{max-width:1180px;margin:auto;padding:30px 22px 70px}.hero{background:var(--yellow);border:3px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);display:flex;align-items:center;justify-content:space-between;padding:27px 32px;overflow:hidden;min-height:195px}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1;margin:9px 0;letter-spacing:-.055em}.hero p{margin:0;font-size:17px}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}.hero img{width:145px;height:150px;object-fit:cover;object-position:center 19%;border-radius:18px;border:3px solid var(--ink);transform:rotate(4deg)}.layout{display:grid;grid-template-columns:210px 1fr;gap:24px;margin-top:30px;align-items:start}.nav{position:sticky;top:16px;background:white;border:2px solid var(--ink);border-radius:18px;padding:12px}.nav button{width:100%;display:flex;text-align:left;gap:10px;align-items:center;border:0;background:transparent;padding:10px;border-radius:12px;font-weight:800;color:#4d5371}.nav button .num{display:grid;place-items:center;width:30px;height:30px;background:#f1efff;border-radius:9px;color:var(--blue);flex:none}.nav button.active{background:#eaeaff;color:var(--blue)}.nav button.active .num{background:var(--blue);color:white}.panel{min-width:0;background:white;border:2px solid var(--ink);border-radius:22px;padding:clamp(20px,3.5vw,38px);box-shadow:6px 6px 0 #d8d6ff}.chip{display:inline-block;padding:8px 13px;background:#e7e7ff;border-radius:20px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.1em}.panel h2{font-size:clamp(29px,4vw,43px);line-height:1.05;letter-spacing:-.04em;margin:14px 0}.intro{color:#59617f;font-size:16px;line-height:1.55;margin-bottom:23px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:#f7f6ff;border:2px solid #e9e7ff;border-radius:17px;padding:19px;margin:13px 0}.grid .card{margin:0}.card.yellow{background:#fff9d9;border-color:#f9e78b}.card.pink{background:#fff0f6;border-color:#ffd4e6}.card.blue{background:#eef5ff;border-color:#c9dcff}.card h3{font-size:19px;margin:7px 0 12px}.card p{line-height:1.6}.small{color:#636d8c;font-size:14px;line-height:1.55}.prompt{font-size:18px;font-weight:800;line-height:1.4}.pill{border:2px solid #d9ddf4;background:white;border-radius:12px;padding:10px 13px;margin:4px;color:var(--ink);font-weight:700}.pill:hover,.pill.selected{border-color:var(--blue);background:#e9e9ff}.pill.correct,.pill.matched{background:#dcf7dc;border-color:#61b878}.pill.wrong{background:#ffebeb;border-color:#e77777}.feedback{min-height:20px;color:#365a49;font-weight:700;font-size:14px}.queen{width:100%;max-width:450px;display:block;border:2px solid var(--ink);border-radius:15px}.teacher{background:#e6f7ec;border:2px solid #a6dbb6;padding:18px;border-radius:16px;margin:18px 0}.teacher h4{margin:0;color:#228052;font-size:12px;letter-spacing:.1em}.teacher blockquote{margin:12px 0;background:white;border-left:4px solid #45b775;padding:13px;line-height:1.5}.teacher p{font-size:14px;line-height:1.6}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.btn{border:2px solid var(--ink);border-radius:13px;padding:12px 18px;background:var(--blue);color:white;font-weight:900;box-shadow:3px 3px 0 var(--ink)}.btn.secondary{background:white;color:var(--ink)}.wordgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wordgrid>div{background:#f7f6ff;border-radius:14px;padding:10px}.wordgrid button{display:block;width:100%;text-align:left;margin:7px 0}.story{font-size:17px;line-height:1.75}.support{background:#fff7cc;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.6}.navtitle{font-size:10px;letter-spacing:.12em;color:#9298b2;padding:10px}.progress{height:8px;background:#efeeff;border-radius:8px;margin:14px 0}.progress span{display:block;height:100%;background:var(--pink);border-radius:8px}textarea{width:100%;border:2px solid #dddff0;border-radius:10px;padding:12px;resize:vertical}.reveal{background:#fff;border:0;color:var(--blue);font-weight:800;text-decoration:underline;padding:0}.hidden{display:none}.question{font-weight:800;line-height:1.4}.match-status{min-height:25px}.quote{font-size:14px;color:#626c8a}.picture{font-size:38px;display:flex;align-items:center;justify-content:center;width:72px;height:72px;border:2px solid var(--ink);border-radius:19px;margin-bottom:12px;background:#ffdc2c}.card:nth-child(2n) .picture{background:#ffcbe1}.card:nth-child(3n) .picture{background:#c8e5ff}.test-card{border:2px solid #e5e5fb;border-radius:16px;padding:16px;margin:14px 0}.test-card strong{display:block;font-size:17px;line-height:1.4}.typing{max-width:310px;padding:11px;border:2px solid #ced3ef;border-radius:10px}.order-zone{min-height:48px;background:white;border:2px dashed #c5c8ef;border-radius:12px;padding:6px;margin:10px 0}.answertext{font-size:15px;line-height:1.55;color:#545d7b}.visual-strip{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}.visual-strip span{background:#eef5ff;border:2px solid #d7e5ff;padding:11px;border-radius:14px;font-size:23px}.subhead{font-size:24px;margin:30px 0 7px}.smallbtn{padding:9px 14px}.selected[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}@media(max-width:760px){.head{padding:12px 15px}.logo{font-size:18px}.mode button{padding:8px}.wrap{padding:19px 15px 50px}.hero{min-height:150px;padding:20px}.hero img{width:85px;height:100px}.hero h1{font-size:35px}.hero p{font-size:14px}.layout{display:block}.nav{position:static;display:flex;overflow:auto;margin-bottom:18px;padding:8px;gap:4px}.navtitle{display:none}.nav button{min-width:140px}.grid{grid-template-columns:1fr}.panel{padding:20px}.wordgrid{gap:6px}.wordgrid button{font-size:13px}.queen{max-width:100%}}
.head{position:sticky;top:0;z-index:10;background:var(--cream);border-bottom:1px solid #DCD5C7}

</style></head><body><header class="head"><a class="logo" href="./#4/learn">English · К курсу</a><div class="mode"><button id="student" class="active" aria-pressed="true">Student</button><button id="teacher" aria-pressed="false">Teacher</button></div></header><main class="wrap"><div class="hero"><div><div class="eyebrow">Let’s get to know each other ✦</div><h1>Nice to meet you!</h1><p>Speak, play and discover your English superpowers.</p></div><img src="keks.png" alt="Keks the tabby cat reading a book"></div><div class="layout"><aside class="nav"><div class="navtitle">CHOOSE A SECTION</div><div id="nav"></div></aside><section class="panel"><div id="content"></div><div class="actions"><button class="btn secondary" onclick="go(-1)">Back</button><button class="btn" onclick="go(1)">Next section</button></div></section></div></main><script>
const choice=(question,options,answer,explain)=>`<div class="card"><p class="question">${question}</p><div class="quiz" data-answer="${answer}" data-explain="${explain}">${options.map(o=>`<button class="pill" data-v="${o}">${o}</button>`).join('')}<p class="feedback" aria-live="polite"></p></div></div>`;
const sections=[
{nav:'Mood check',title:'Which Queen are you today?',intro:'Choose the picture that matches your mood. Tell your teacher why.',body:`<div class="grid"><div><img class="queen" src="queen.jpeg" alt="Nine numbered pictures of Queen Elizabeth II showing different moods"></div><div><div class="card yellow"><div class="eyebrow">Pick a number</div><div id="moods">${Array.from({length:9},(_,i)=>`<button class="pill" onclick="mood(this,${i+1})">${i+1}</button>`).join('')}</div><p id="moodlabel" class="small">Choose a picture 👑</p></div><div class="support"><b>Say more 💬</b><br>Today I feel … because …<br>I chose number … because …<br>I’m a bit … but I’m also …<br><br><b>Words:</b> excited · tired · curious · relaxed · nervous · cheerful · surprised</div></div></div>`,guide:`<blockquote>“Hello! It’s lovely to meet you. Which Queen are you today? Why did you choose that picture?”</blockquote><p>Model an answer first. Ask: “What happened today?” or “What makes you feel like that?” Notice confidence and spontaneous vocabulary.</p>`},
{nav:'About you',title:'Let’s get to know you',intro:'Pick a card, choose a question and tell your teacher about you. Ask a question back!',body:`<div class="visual-strip" aria-hidden="true"><span>🎮</span><span>⚽</span><span>🎨</span><span>🎵</span><span>📚</span><span>🌍</span></div><div class="grid">${[['👋','Meet you','What do you like to be called? How would your friends describe you?','You can say: My name is … / Please call me … / I’m …, … and … / My friends say I’m …','curious · friendly · creative · active · funny · calm'],['🎮','Your free time','What do you like doing after school? What do you do at weekends?','I’m really into … / I usually … / I started … when I was … / I enjoy it because …','playing games · doing sport · drawing · reading · making videos · music'],['⭐','Favourites','What is your favourite game, book, film or place? Why?','My favourite … is … / I like it because … / My favourite character is … / I recommend it because …','exciting · funny · relaxing · challenging · interesting'],['🏫','School life','What subjects do you enjoy? What are you good at?','I enjoy … because … / I’m good at … / I find … easy / difficult.','science · history · art · maths · languages · PE'],['👥','Friends & family','What do you enjoy doing with your friends or family?','We usually … together. / At weekends we … / I like … because …','play · chat · travel · cook · watch films · go for a walk'],['🌍','Dreams & plans','What would you like to try or learn? Where would you like to go?','I’d like to … / I want to … because … / One day I hope to …','travel · learn a skill · visit a place · make a game · try a new sport']].map(([emoji,title,q,a,w],i)=>`<div class="card ${i%2?'pink':'blue'}"><div class="picture" aria-hidden="true">${emoji}</div><div class="eyebrow">PICK A TOPIC</div><h3>${title}</h3><p class="prompt">${q}</p><details open><summary class="reveal">💬 Speaking help</summary><p class="support">${a}<br><br><b>Word bank:</b> ${w}<br><br><b>Ask back:</b> What about you? / What do you enjoy? / Why?</p></details></div>`).join('')}</div><div class="card yellow"><b>Level up!</b> Can you give an example? When did you start? Why do you like it? What about your teacher?</div>`,guide:`<blockquote>“Choose a picture or a topic. Tell me a little about yourself. Can you give me an example? What about me — would you like to ask a question?”</blockquote><p>Pick 2–3 cards rather than rushing through all six. Let the learner try independently before pointing to the sentence starters. Notice fluency, vocabulary, pronunciation and question formation.</p>`},
{nav:'Your English',title:'Your English: the fun quiz!',intro:'Choose an answer for each question. There are no wrong answers — tell your teacher why!',body:`<div class="card yellow"><div class="picture">🧭</div><b>How to play:</b> Tap one answer per question. Explain your choice. You can choose a different answer later!</div>${[['🎬','1. English becomes a superpower! What do you use it for?',['Understanding videos','Talking to people','Playing games','Travelling anywhere'], 'I’d choose … because … / I want to …'],['🎮','2. Your ideal lesson begins. What happens first?',['A game or a challenge','A funny conversation','A story or a video','A puzzle to solve'], 'I enjoy … because … / My ideal lesson starts with …'],['🕵️','3. You find a mysterious English word. What do you do?',['Guess from the context','Ask a question','Look it up','Try it in a sentence'], 'I usually … / I think … is helpful because …'],['🚀','4. Choose your English mission for the next year.',['Speak more confidently','Get an excellent grade (5) in English','Keep up in English lessons','Understand videos','Learn useful words'], 'I want to … / I want to get a 5 in English. / I want to keep up in class because …'],['🧩','5. A task feels difficult. What helps you most?',['An example','A little thinking time','A clue or a picture','Working it out together'], 'It helps when … / I’d like my teacher to …'],['🎭','6. What would you add to your dream lesson?',['Games and quizzes','Projects and videos','Stories and role-play','A surprise topic'], 'I’d add … because … / I’d also like …']].map(([icon,q,opts,help])=>`<div class="test-card"><strong>${icon} ${q}</strong><div class="personal-quiz">${opts.map(o=>`<button class="pill personal-option" aria-pressed="false">${o}</button>`).join('')}</div><p class="support">💬 ${help}</p></div>`).join('')}<div class="card blue"><h3>One more thing…</h3><p class="prompt">What English lessons have you had before? What did you like? What would you change?</p><p class="support">Before, I … / I liked … because … / I found … difficult. / Next time, I’d like …</p></div>`,guide:`<blockquote>“Let’s find out how you like learning! Choose the answer that sounds most like you. There are no wrong answers. Why did you choose that?”</blockquote><p>Each question is a conversation starter, not a scored personality test. Ask about previous lessons, English goals and what support the learner likes. Accept answers beyond the choices.</p>`},
{nav:'Word games',title:'Vocabulary challenge',intro:'Explore different topics. Choose the best answer, match the pairs and use the words to talk about yourself.',body:`<div class="visual-strip" aria-hidden="true"><span>🏫</span><span>😄</span><span>🚀</span><span>🗺️</span><span>🤝</span><span>🎨</span></div><div class="eyebrow">⚡ GAME 1 · CHOOSE THE MEANING</div><p class="small">Try without help. You can try again if you need to.</p>${[
['1. What does “curious” mean?',['любознательный','усталый','сердитый'],'любознательный','Curious means wanting to learn or know more.'],
['2. What is an “opportunity”?',['возможность','расписание','путешествие'],'возможность','An opportunity is a chance to do something.'],
['3. What does “achieve” mean?',['достигать','забывать','спорить'],'достигать','Achieve means succeed in doing something.'],
['4. Choose the word for «улучшать».',['improve','invite','imagine'],'improve','Improve means make something better.'],
['5. Choose the word for «уверенный».',['confident','careful','nervous'],'confident','Confident means sure of yourself.'],
['6. “I get on well with my classmates.”',['Я хорошо лажу с одноклассниками','Я опаздываю в школу','Я соревнуюсь с одноклассниками'],'Я хорошо лажу с одноклассниками','It means having a good relationship.'],
['7. A “challenge” is …',['сложная задача','праздник','обычный день'],'сложная задача','A challenge is something difficult that tests your ability.'],
['8. To “explore” is to …',['исследовать','объяснять','приглашать'],'исследовать','Explore means discover or learn about a place or subject.'],
['9. “I’m looking forward to the trip.”',['Я с нетерпением жду поездки','Я опаздываю в поездку','Я забыл о поездке'],'Я с нетерпением жду поездки','Look forward to means wait for something with pleasure.'],
['10. “Instead of” means …',['вместо','несмотря на','вместе с'],'вместо','Instead of introduces an alternative.'],
['11. A “journey” is …',['путешествие','победа','приглашение'],'путешествие','A journey is travelling from one place to another.'],
['12. “Borrow” means …',['взять взаймы','дать взаймы','купить'],'взять взаймы','You borrow something from another person.'],
['13. “Ancient” means …',['древний','современный','будущий'],'древний','Ancient means from a very long time ago.'],
['14. A “clue” helps you …',['solve a mystery','make a sandwich','catch a bus'],'solve a mystery','A clue is a piece of information that helps solve a problem.'],
['15. “Crowded” describes a place with …',['a lot of people','no people','lots of trees'],'a lot of people','Crowded means full of people.'],
['16. “Proud” means …',['гордый','грустный','испуганный'],'гордый','Proud means pleased about an achievement.'],
['17. Choose the best word: “I want to ___ a new skill.”',['learn','teach','forget'],'learn','You learn a skill; you teach someone a skill.'],
['18. “I can’t wait!” means …',['I’m very excited!','I’m very tired.','I don’t like it.'],'I’m very excited!','It can mean you are excited about something coming soon.']].map(q=>choice(...q)).join('')}
<div class="card blue"><div class="eyebrow">⚡ GAME 2 · TRUE OR FALSE</div><h3>Верно или неверно?</h3><p class="small">Read an English word and its Russian translation. Decide if the translation is correct. Ten quick rounds!</p><div id="tfGame" class="quick-game"></div></div><div class="card pink"><div class="eyebrow">🎯 GAME 3 · PICK THE TRANSLATION</div><h3>Выбери перевод</h3><p class="small">Choose the correct Russian meaning. Ten words, one at a time!</p><div id="pickGame" class="quick-game"></div></div><div class="card yellow"><div class="eyebrow">🧩 GAME 4 · MATCH THE PAIRS</div><p class="small">Tap an English word, then tap its Russian meaning.</p><div class="wordgrid"><div>${[['challenge','challenge'],['improve','improve'],['explore','explore'],['confident','confident'],['borrow','borrow'],['curious','curious']].map(([t,id])=>`<button class="pill match" data-side="en" data-id="${id}">${t}</button>`).join('')}</div><div>${[['любознательный','curious'],['исследовать','explore'],['уверенный','confident'],['взять взаймы','borrow'],['улучшать','improve'],['сложная задача','challenge']].map(([t,id])=>`<button class="pill match" data-side="ru" data-id="${id}">${t}</button>`).join('')}</div></div><p id="matchStatus" class="feedback match-status" aria-live="polite">0 / 6 pairs</p><button class="reveal" onclick="resetMatch()">Play again ↻</button></div><div class="card pink"><h3>🎤 Make the words yours</h3><p>What skill would you like to improve? Tell me about a challenge or a place you want to explore.</p><p class="support">I’d like to improve … because … / One challenge was … / I’d like to explore … / I’m curious about …</p></div>`,guide:`<blockquote>“Choose the best meaning. What helped you work it out? Can you use the word in a sentence? Now match the pairs.”</blockquote><p><b>Keys:</b> 1 любознательный; 2 возможность; 3 достигать; 4 improve; 5 confident; 6 хорошо лажу; 7 сложная задача; 8 исследовать; 9 с нетерпением жду; 10 вместо; 11 путешествие; 12 взять взаймы; 13 древний; 14 solve a mystery; 15 a lot of people; 16 гордый; 17 learn; 18 I’m very excited. Matching: challenge — сложная задача; improve — улучшать; explore — исследовать; confident — уверенный; borrow — взять взаймы; curious — любознательный.</p><p>Use this as an item bank: select about 8–10 items in a 60-minute lesson and return to the rest later. Record recognition and active use separately.</p>`},
{nav:'Grammar lab',title:'Grammar lab: 3 challenges',intro:'Three different games, seven questions each. Choose, complete and build sentences!',body:`<div class="card yellow"><div class="eyebrow">🧠 CHALLENGE 1 · CHOOSE</div><p class="small">Choose the best answer.</p></div>${[
['1. My brother usually ___ to school by bus.',['goes','is going','went'],'goes','A routine: Present Simple.'],
['2. Look! The dog ___ in the garden.',['runs','is running','ran'],'is running','Happening now: Present Continuous.'],
['3. We ___ a museum last Saturday.',['visit','visited','are visiting'],'visited','A finished past event: Past Simple.'],
['4. At 7 p.m. yesterday, I ___ a book.',['read','was reading','will read'],'was reading','An action in progress at a past time: Past Continuous.'],
['5. I think it ___ sunny tomorrow.',['will be','was','is being yesterday'],'will be','A future prediction: Future Simple.'],
['6. She ___ play football on Mondays.',['doesn’t','isn’t','didn’t usually'],'doesn’t','Present Simple negative with she.'],
['7. ___ you watching a film right now?',['Are','Do','Did'],'Are','Present Continuous question: Are you …?']].map(q=>choice(...q)).join('')}
<div class="card blue"><div class="eyebrow">✍️ CHALLENGE 2 · COMPLETE</div><p class="small">Type the correct form of the verb in brackets. Check each answer.</p></div>${[
['1. He often ___ English videos. (watch)','watches'],['2. Listen! They ___ a song. (sing)','are singing'],['3. Yesterday we ___ pizza. (eat)','ate'],['4. At 5 p.m. yesterday, she ___ a game. (play)','was playing'],['5. I think I ___ my friend tomorrow. (see)','will see'],['6. She ___ like spiders. (not / do)','does not|doesn’t|doesn\'t'],['7. ___ you go to the cinema last week? (do)','did']].map((q,i)=>`<div class="card"><p class="question">${q[0]}</p><div class="fill" data-answer="${q[1]}"><label><span class="small">Your answer </span><input class="typing" type="text" autocomplete="off" aria-label="Answer to sentence ${i+1}"></label> <button class="pill fill-check">Check</button><p class="feedback" aria-live="polite"></p></div></div>`).join('')}
<div class="card pink"><div class="eyebrow">🧩 CHALLENGE 3 · BUILD THE SENTENCE</div><p class="small">Tap the words in the correct order, then check. Tap a selected word to remove it.</p></div>${[
['1. A daily routine',['plays','She','tennis','every','Saturday'],['She','plays','tennis','every','Saturday']],
['2. Right now',['is','He','a','reading','book'],['He','is','reading','a','book']],
['3. A past event',['a','We','museum','visited','yesterday'],['We','visited','a','museum','yesterday']],
['4. At that moment',['were','They','playing','football'],['They','were','playing','football']],
['5. A prediction',['will','I','learn','English'],['I','will','learn','English']],
['6. A question',['you','Do','like','music'],['Do','you','like','music']],
['7. A negative',['not','He','watching','is','TV'],['He','is','not','watching','TV']]].map(([q,words,answer])=>`<div class="card order" data-answer="${answer.join(' ')}"><p class="question">${q}</p><div class="order-zone" aria-label="Your sentence"></div><div class="word-bank">${words.map(w=>`<button class="pill tile">${w}</button>`).join('')}</div><button class="pill order-check">Check</button><button class="reveal order-reset">Reset ↻</button><p class="feedback" aria-live="polite"></p></div>`).join('')}
<div class="support"><b>Speaking bonus:</b> I usually … / Right now I’m … / Yesterday I … / At 7 p.m. I was … / Tomorrow I think I’ll …</div>`,guide:`<blockquote>“Let’s try three short grammar challenges. Choose an answer, complete the verb, then build a sentence. What helped you decide?”</blockquote><p><b>Challenge 1:</b> goes; is running; visited; was reading; will be; doesn’t; Are.<br><b>Challenge 2:</b> watches; are singing; ate; was playing; will see; doesn’t / does not; Did.<br><b>Challenge 3:</b> She plays tennis every Saturday. / He is reading a book. / We visited a museum yesterday. / They were playing football. / I will learn English. / Do you like music? / He is not watching TV.</p><p>Use these 21 items flexibly: select a few from each game in the first lesson. Ask the learner to make a true sentence; note independent production. Limit this lesson to Simple and Continuous forms.</p>`},
{nav:'Reading',title:'The museum mix-up',intro:'A boy, a museum and one very confusing English sign. Read the story and solve the quiz!',body:`<div class="card blue"><div class="eyebrow">🔮 BEFORE YOU READ · WARM-UP</div><h3>Guess the museum mystery!</h3><p class="small">Look at these clues: 🦖 🏛️ 🔊 👑. What do you think will happen? Choose your prediction.</p><div class="personal-quiz"><button class="pill personal-option" aria-pressed="false">A dinosaur comes to life!</button><button class="pill personal-option" aria-pressed="false">A boy misunderstands an English sign.</button><button class="pill personal-option" aria-pressed="false">A king loses his crown.</button></div><p class="support">💬 I think … because … / Maybe … / I predict …</p><p class="small"><b>Find the words:</b> 🦴 skeleton · 🪧 sign · 🔊 speaker. Which one might surprise Leo?</p></div><div class="card yellow"><div class="eyebrow">📖 A FUNNY STORY</div><h3>Leo and the mysterious sign 🏛️</h3><div class="story"><p>Last Saturday, Leo visited a museum with his sister Anna. He loved dinosaurs, but many signs were in English.</p><p>He saw a huge dinosaur skeleton and a sign: <b>“Please do not touch the exhibits.”</b> Leo didn’t know the word “exhibits”. “Are exhibits a special kind of dinosaur?” he whispered.</p><p>Anna laughed. “No! Exhibits are things we see in museums. Don’t touch them!” Leo smiled. “I just wanted to shake the dinosaur’s hand!”</p><p>In the next room, a picture of a king hung on the wall. Suddenly, a voice said, “Hello! Welcome to the museum!” Leo jumped. “The king is talking!”</p><p>Anna pointed to a speaker. It was an audio guide! “His English is excellent,” Leo said. “But why does the king have an American accent?”</p><p>Leo bought a dinosaur postcard. On the way home, he made a rule: “When you don’t understand a sign, ask someone. And never try to shake hands with a dinosaur!”</p></div><p class="small"><b>Word help:</b> skeleton — скелет · exhibits — экспонаты · sign — табличка · speaker — динамик · audio guide — аудиогид · shake hands — пожать руки</p></div><div class="eyebrow">🔎 READING CHECK</div>${[
['1. Who went to the museum with Leo?',['His sister Anna','His teacher','His friend'],'His sister Anna','Anna is Leo’s older sister.'],
['2. What did Leo think “exhibits” might be?',['A kind of dinosaur','A new museum','A funny king'],'A kind of dinosaur','He asked if exhibits were a special kind of dinosaur.'],
['3. What did Leo want to do?',['Shake the dinosaur’s hand','Take the skeleton home','Touch the king’s picture'],'Shake the dinosaur’s hand','He said he wanted to shake the dinosaur’s hand.'],
['4. Where did the loud voice come from?',['A speaker','The king in the picture','A dinosaur'],'A speaker','It came from a speaker in the audio guide.'],
['5. What did Leo buy?',['A dinosaur postcard','An audio guide','A toy king'],'A dinosaur postcard','He bought a postcard at the end of the visit.'],
['6. What did Leo decide to do when he didn’t understand?',['Ask someone','Touch the exhibit','Leave the museum'],'Ask someone','Leo’s new rule was to ask someone.']].map(q=>choice(...q)).join('')}
<div class="grid"><div class="card blue"><h3>💬 Talk about it</h3><p class="prompt">Why was Leo surprised? Which moment was funniest?</p><p class="support">He was surprised because … / I think … was funny because … / My favourite part was …</p></div><div class="card pink"><h3>🎨 Your turn</h3><p class="prompt">What would you like to see in a museum? What would you say to the dinosaur?</p><p class="support">I’d like to see … because … / I would say, “…” / If I were there, I’d …</p></div></div><div class="card yellow"><h3>✨ Retell the story</h3><p>Put these events in order: <b>Leo hears a voice · Leo sees a dinosaur · Leo buys a postcard · Anna explains a word.</b></p><p class="support">First, … / Then, … / After that, … / Finally, …</p></div>`,guide:`<blockquote>“First, read the story. What confused Leo? Now find the answers in the text. Which part did you find funny?”</blockquote><p><b>Reading keys:</b> 1 his sister Anna; 2 a kind of dinosaur; 3 shake its hand; 4 a speaker; 5 a dinosaur postcard; 6 ask someone. <b>Sequence:</b> sees dinosaur → Anna explains → hears voice → buys postcard. Ask for evidence and listen to a short passage read aloud. Open answers vary.</p><p>For a 60-minute first lesson, read aloud or silently and choose 3–4 comprehension questions; leave the rest for follow-up.</p>`},
{nav:'Next adventure',title:'Your next chapter',intro:'Think about today and choose what you would like to explore next.',body:`<div class="grid"><div class="card yellow"><h3>⭐ My favourite part</h3><p class="prompt">What did you enjoy most today?</p><p class="support">I enjoyed … because …</p></div><div class="card pink"><h3>🎯 My goal</h3><p class="prompt">What would you like to improve?</p><p class="support">I’d like to get better at …</p></div><div class="card blue"><h3>🚀 Next time</h3><p class="prompt">What topics, games or stories would you like next time?</p><p class="support">Next time, I’d like to …</p></div><div class="card"><h3>❓ Your turn</h3><p class="prompt">What would you like to ask your teacher?</p><p class="support">What is your favourite …? / Do you like …?</p></div></div><div class="card yellow"><h3>High five! ✋</h3><p>You shared your ideas, played with words and solved a mystery. Great work!</p></div>`,guide:`<blockquote>“What did you enjoy most? What would you like us to practise next time? Do you have a question for me?”</blockquote><p>Give one specific strength and agree on one achievable next step. Record speaking, listening, reading, vocabulary, grammar and learner preferences. This is an initial snapshot, not a formal CEFR assessment.</p><textarea rows="4" id="notes" placeholder="Teacher notes on this device…" aria-label="Teacher notes"></textarea><p class="small">Notes stay in this browser on this device.</p>`}
];const quickData={tf:[['curious','любознательный',true],['ancient','современный',false],['borrow','взять взаймы',true],['crowded','пустой',false],['improve','улучшать',true],['journey','победа',false],['proud','гордый',true],['explore','забывать',false],['challenge','сложная задача',true],['confident','испуганный',false]],pick:[['achieve',['достигать','избегать','помнить'],0],['opportunity',['ошибка','возможность','привычка'],1],['ancient',['древний','шумный','новый'],0],['borrow',['продать','подарить','взять взаймы'],2],['crowded',['пустой','многолюдный','тихий'],1],['improve',['улучшать','сравнивать','отменять'],0],['journey',['соревнование','путешествие','задание'],1],['proud',['скучающий','сердитый','гордый'],2],['explore',['исследовать','приглашать','обещать'],0],['confident',['нерешительный','уверенный','удивлённый'],1]]};const quickState={tf:{index:0,score:0,answered:false},pick:{index:0,score:0,answered:false}};function drawQuick(type){const el=document.getElementById(type==='tf'?'tfGame':'pickGame');if(!el)return;const st=quickState[type],items=quickData[type];if(st.index>=items.length){el.innerHTML='<h3>🏆 Finished! '+st.score+' / 10</h3><button class="btn" onclick="restartQuick(\''+type+'\')">Play again ↻</button>';return}const item=items[st.index];const opts=type==='tf'?['✓ True','✕ False']:item[1];el.innerHTML='<p class="small">Round '+(st.index+1)+' / 10 · Score '+st.score+'</p><div class="progress"><span style="width:'+((st.index)/10*100)+'%"></span></div><p class="prompt">'+item[0]+(type==='tf'?' — '+item[1]:'')+'</p><div>'+opts.map((o,i)=>'<button class="pill" onclick="answerQuick(\''+type+'\','+i+')">'+o+'</button>').join('')+'</div><p class="feedback" aria-live="polite"></p><div class="quick-next"></div>'}function answerQuick(type,i){const st=quickState[type];if(st.answered)return;st.answered=true;const item=quickData[type][st.index],correct=type==='tf'?(i===0)===item[2]:i===item[2];if(correct)st.score++;const el=document.getElementById(type==='tf'?'tfGame':'pickGame');const buttons=el.querySelectorAll('.pill');buttons.forEach((b,j)=>{b.disabled=true;if(type==='tf'?((j===0)===item[2]):j===item[2])b.classList.add('correct');else if(j===i&&!correct)b.classList.add('wrong')});el.querySelector('.feedback').textContent=correct?'✓ Correct!':'Not quite — look at the correct answer.';el.querySelector('.quick-next').innerHTML='<button class="btn smallbtn" onclick="nextQuick(\''+type+'\')">Next word →</button>'}function nextQuick(type){quickState[type].index++;quickState[type].answered=false;drawQuick(type)}function restartQuick(type){quickState[type]={index:0,score:0,answered:false};drawQuick(type)}
let current=0,teacher=false,matchPick=null,matched=0;function setMode(value){teacher=value;document.querySelector('#student').classList.toggle('active',!value);document.querySelector('#teacher').classList.toggle('active',value);render()}function go(n){current=Math.max(0,Math.min(sections.length-1,current+n));render();window.scrollTo({top:0,behavior:'smooth'})}function render(){matchPick=null;matched=0;let s=sections[current];document.querySelector('#nav').innerHTML=sections.map((x,i)=>`<button class="${i===current?'active':''}" onclick="current=${i};render()"><span class="num">${i+1}</span>${x.nav}</button>`).join('');document.querySelector('#content').innerHTML=`<span class="chip">SECTION ${current+1} / ${sections.length}</span><div class="progress"><span style="width:${(current+1)/sections.length*100}%"></span></div><h2>${s.title}</h2><p class="intro">${s.intro}</p>${teacher?`<div class="teacher"><h4>✦ TEACHER'S GUIDE</h4>${s.guide}</div>`:''}${s.body}`;drawQuick('tf');drawQuick('pick');document.querySelectorAll('.quiz').forEach(q=>q.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let correct=b.dataset.v===q.dataset.answer;q.querySelectorAll('button').forEach(x=>x.classList.remove('correct','wrong'));b.classList.add(correct?'correct':'wrong');q.querySelector('.feedback').textContent=correct?'✓ Correct! '+q.dataset.explain:'Try again — you can do it!'}));document.querySelectorAll('.match').forEach(b=>b.addEventListener('click',()=>match(b)));document.querySelectorAll('.personal-quiz').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.personal-option');if(!b)return;g.querySelectorAll('button').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true')}));document.querySelectorAll('.fill').forEach(f=>f.querySelector('.fill-check').addEventListener('click',()=>{let x=f.querySelector('input').value.trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' '), choices=f.dataset.answer.toLowerCase().replace(/[’]/g,"'").split('|');f.querySelector('.feedback').textContent=!x?'Write an answer first.':choices.includes(x)?'✓ Correct!':'Try again!'}));document.querySelectorAll('.order').forEach(o=>{let bank=o.querySelector('.word-bank'),zone=o.querySelector('.order-zone');o.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>{(t.parentElement===bank?zone:bank).appendChild(t);o.querySelector('.feedback').textContent=''}));o.querySelector('.order-check').addEventListener('click',()=>{let text=[...zone.querySelectorAll('.tile')].map(t=>t.textContent).join(' ');o.querySelector('.feedback').textContent=text===o.dataset.answer?'✓ Great sentence!':text?'Try a different order.':'Choose some words first.'});o.querySelector('.order-reset').addEventListener('click',()=>{[...zone.querySelectorAll('.tile')].forEach(t=>bank.appendChild(t));o.querySelector('.feedback').textContent=''})});let notes=document.getElementById('notes');if(notes){notes.value=localStorage.getItem('keks-lesson-notes')||'';notes.oninput=()=>localStorage.setItem('keks-lesson-notes',notes.value)}}function mood(b,n){document.querySelectorAll('#moods button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#moodlabel').textContent=`Number ${n}! How do you feel? Why?`}function match(b){if(b.classList.contains('matched'))return;if(!matchPick){matchPick=b;b.classList.add('selected');return}if(matchPick===b){b.classList.remove('selected');matchPick=null;return}if(matchPick.dataset.side===b.dataset.side){matchPick.classList.remove('selected');matchPick=b;b.classList.add('selected');return}if(matchPick.dataset.id===b.dataset.id){matchPick.classList.remove('selected');matchPick.classList.add('matched');b.classList.add('matched');matched++;document.querySelector('#matchStatus').textContent=matched===6?'6 / 6 pairs — amazing! ✨':`${matched} / 6 pairs — great match!`}else{matchPick.classList.remove('selected');document.querySelector('#matchStatus').textContent=`${matched} / 6 pairs — try another pair!`}matchPick=null}function resetMatch(){matched=0;matchPick=null;document.querySelectorAll('.match').forEach(b=>b.classList.remove('matched','selected'));document.querySelector('#matchStatus').textContent='0 / 6 pairs'}render();
</script>
<dialog id="intro-mode-dialog" aria-labelledby="intro-mode-title"><form method="dialog">
  <h2 id="intro-mode-title">Режим учителя</h2>
  <p>Код открывает подсказки и ответы в интерфейсе этого урока.</p>
  <label for="intro-teacher-code">Код учителя</label><input id="intro-teacher-code" type="password" autocomplete="off" required>
  <p role="alert" hidden>Неверный код. Попробуйте ещё раз.</p>
  <button class="btn secondary" value="cancel" formnovalidate>Отмена</button>
  <button class="btn" type="button" data-unlock>Открыть режим учителя</button>
</form></dialog>
<script type="module">
import {bindTeacherMode} from './teacher.js';
bindTeacherMode({
  dialog:document.querySelector('#intro-mode-dialog'),
  student:document.querySelector('#student'),
  teacher:document.querySelector('#teacher'),
  onChange:window.setMode
});
</script>
</body></html>
